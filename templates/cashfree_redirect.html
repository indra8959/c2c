<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Redirecting...</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #ffffff;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    h2 {
      margin-bottom: 10px;
      color: #222;
    }

    p {
      color: #666;
      font-size: 14px;
    }

    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 20px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Payment Successful</h2>

    <p>Redirecting back to app...</p>

    <a
      class="btn"
      href="care2connect://payment-success"
    >
      Open App
    </a>

  </div>

  <script>

    // AUTO REDIRECT TO APP
    window.location.href =
      "care2connect://payment-success";

    // FALLBACK MESSAGE
    setTimeout(() => {

      document.querySelector("p").innerHTML =
        "If app did not open, tap the button above.";

    }, 5000);

  </script>

</body>
</html>
