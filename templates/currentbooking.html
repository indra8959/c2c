    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, rgba(99, 102, 241, 0.05) 0, transparent 50%);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .custom-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.03), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .notification-enter {
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Time Picker Scroller Styling */
        .time-scroller {
            height: 120px;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
        }
        .time-scroller::-webkit-scrollbar {
            display: none;
        }
        .time-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-weight: 700;
            color: #94a3b8;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .time-item.selected {
            color: #059669;
            font-size: 1.4rem;
            transform: scale(1.1);
        }

        .fixed-badge {
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>
        const USER_ID = "67ee5e1bde4cb48c515073ee";
        const BASE_API_URL = "https://api.care2connect.in";
        let patients = [];
        let pendingAssign = null;
        let submitState = "idle";
        let submittime = "00:00";
        let selectedHour = "18";
        let selectedMinute = "00";

        // Helper to get local date in YYYY-MM-DD
        function getLocalDate() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // --- View Logic ---
        function toggleTimerView(show) {
            const btn = document.getElementById('revealTimerBtn');
            const controls = document.getElementById('timerControls');
            if (show) {
                btn.classList.add('hidden');
                controls.classList.remove('hidden');
                setTimeout(() => {
                    setScrollerToValue('hour', selectedHour);
                    setScrollerToValue('minute', selectedMinute);
                }, 50);
            } else {
                btn.classList.remove('hidden');
                controls.classList.add('hidden');
            }
        }

        // --- Time Scroller Logic ---
        function handleTimeScroll(type) {
            const scroller = document.getElementById(`${type}-scroller`);
            const items = scroller.querySelectorAll('.time-item[data-val]');
            const scrollerRect = scroller.getBoundingClientRect();
            const scrollerCenter = scrollerRect.top + scrollerRect.height / 2;

            let closest = null;
            let minDistance = Infinity;

            items.forEach(item => {
                const itemRect = item.getBoundingClientRect();
                const itemCenter = itemRect.top + itemRect.height / 2;
                const distance = Math.abs(scrollerCenter - itemCenter);

                if (distance < minDistance) {
                    minDistance = distance;
                    closest = item;
                }
                item.classList.remove('selected');
            });

            if (closest) {
                closest.classList.add('selected');
                if (type === 'hour') selectedHour = closest.dataset.val;
                else selectedMinute = closest.dataset.val;
            }
        }

        function setScrollerToValue(type, value) {
            const scroller = document.getElementById(`${type}-scroller`);
            const item = scroller.querySelector(`.time-item[data-val="${value}"]`);
            if (item) {
                scroller.scrollTop = item.offsetTop - 40; 
                item.classList.add('selected');
            }
        }

        // --- API & Data Logic ---
        async function loadPatients() {
            try {
                const res = await fetch("https://api.care2connect.in/api/patientsx/67ee5e1bde4cb48c515073ee");
                patients = await res.json();
                renderPatients();
            } catch (err) { console.error(err); }
        }

        async function loadStopTime() {
            try {
                const res = await fetch(`${BASE_API_URL}/get_profile/${USER_ID}/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-api-key": "1234" }
                });
                const data = await res.json();
                if (data.COPDstoptime) {
                    const dt = data.COPDstoptime;
                    const today = getLocalDate(); // Fix: Using local date helper
                    console.log(data.COPDstoptime)
                    if (dt.date === today) {
                        const [h, m] = dt.time.split(':');
                        selectedHour = h;
                        selectedMinute = m;
                        submitState = "submitted";
                        submittime = dt.time
                        updateButton();
                    }
                }
            } catch (err) { console.error(err); }
        }

        // function updateButton() {
        //     const btn = document.getElementById("submitBtn");
        //     const text = document.getElementById("btnText");
        //     const revealBtn = document.getElementById("revealTimerBtn");
        //     const revealText = document.getElementById("revealTimertext");

        //     else if (submitState === "submitted"){ text.innerText = "Time Saved"; revealText.innerText=`The current booking will be closed at ${submittime}`; btn.disabled = true; revealBtn.disabled = true;
        // revealBtn.classList.add("opacity-50", "cursor-not-allowed");}
        //     else text.innerText = "Save Stop Time";
        // }

         function updateButton() {
            const btn = document.getElementById("submitBtn");
            const text = document.getElementById("btnText");
            const revealBtn = document.getElementById("revealTimerBtn");
            const revealText = document.getElementById("revealTimertext");
            if (submitState === "loading") text.innerText = "Saving...";
            else if (submitState === "submitted") {
        text.innerText = "Time Saved";

        const currentTime = new Date();

        // submittime = "14:00"
        const [hours, minutes] = submittime.split(":");
        const submitDateTime = new Date();
        submitDateTime.setHours(hours, minutes, 0, 0);

        if (currentTime > submitDateTime) {
            revealText.innerText = "Current booking is closed";
        } else {
            revealText.innerText = `The current booking will be closed at ${submittime}`;
        }

        btn.disabled = true;
        revealBtn.disabled = true;
        revealBtn.classList.add("opacity-50", "cursor-not-allowed");
    } 
        //     else if (submitState === "submitted"){ text.innerText = "Time Saved"; revealText.innerText=`The current booking will be closed at ${submittime}`; btn.disabled = true; revealBtn.disabled = true;
        // revealBtn.classList.add("opacity-50", "cursor-not-allowed");}
            else text.innerText = "Save Stop Time";
        }

        async function saveStopBooking() {
            if (submitState === "loading") return;
            const time = `${selectedHour}:${selectedMinute}`;
            submitState = "loading";
            updateButton();
            try {
                await fetch(`${BASE_API_URL}/v1/send-stop-booking/${USER_ID}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-api-key": "1234" },
                    body: JSON.stringify({ 
                        date: getLocalDate(), // Fix: Using local date helper
                        time: time, 
                        status: false 
                    })
                });
                submitState = "submitted";
                updateButton();
                showNotification(`Bookings will stop at ${time}`);
                setTimeout(() => {toggleTimerView(false);window.location.reload()}, 1500);
            } catch (err) {
                submitState = "idle";
                updateButton();
                showNotification("Failed to save", "error");
            }
        }

        // --- UI Rendering ---
        function renderPatients() {
            const desktopList = document.getElementById('patientListDesktop');
            const mobileList = document.getElementById('patientListMobile');
            const emptyState = document.getElementById('emptyState');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = patients.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.fatherName.toLowerCase().includes(query) || 
                p.mobile.includes(query)
            );

            document.getElementById('totalCount').textContent = filtered.length;
            if (filtered.length === 0) {
                desktopList.innerHTML = mobileList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            desktopList.innerHTML = filtered.map(p => `
                <tr class="group hover:bg-white/40 transition-all">
                    <td class="px-8 py-6">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl ${p.appointmentNo ? 'bg-emerald-600 text-white shadow-lg' : 'bg-emerald-50 text-emerald-500'} flex items-center justify-center font-extrabold">
                                ${p.name.charAt(0)}
                            </div>
                            <span class="font-bold text-slate-900">${highlight(p.name, query)}</span>
                        </div>
                    </td>
                    <td class="px-8 py-6 text-sm font-semibold text-slate-600">${highlight(p.fatherName, query)}</td>
                    <td class="px-8 py-6 text-sm font-bold text-slate-800">${highlight(p.mobile, query)}</td>
                    <td class="px-8 py-6">${renderSlot(p, 'desktop')}</td>
                </tr>
            `).join('');

            mobileList.innerHTML = filtered.map(p => `
                <div class="glass-card rounded-[2.5rem] p-6 custom-shadow space-y-4">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl ${p.appointmentNo ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-500'} flex items-center justify-center font-black text-xl">
                            ${p.name.charAt(0)}
                        </div>
                        <div>
                            <h3 class="font-extrabold text-slate-900 text-lg leading-none">${highlight(p.name, query)}</h3>
                            <p class="text-[10px] font-bold text-slate-400 uppercase mt-2 tracking-wide">S/O: ${highlight(p.fatherName, query)}</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between py-3 border-y border-slate-100/50">
                        <span class="text-slate-400 font-bold uppercase text-[10px]">Contact</span>
                        <span class="font-bold text-slate-700">${highlight(p.mobile, query)}</span>
                    </div>

                    <div class="pt-2">${renderSlot(p, 'mobile')}</div>
                </div>
            `).join('');
        }

        function highlight(text, query) {
            if (!query) return text;
            return text.replace(new RegExp(`(${query})`, "gi"), `<mark class="bg-emerald-100 text-emerald-700 p-0 rounded">$1</mark>`);
        }

        function renderSlot(p, mode) {
            if (p.appointmentNo) {
                return `<div class="bg-emerald-700 text-white px-6 py-3 rounded-2xl font-black text-center shadow-lg italic">TOKEN #${p.appointmentNo}</div>`;
            }
            const inputId = `input-${mode}-${p.id}`;
            return `
                <div class="flex items-center gap-2">
                    <input type="text" id="${inputId}" placeholder="Assign #" class="w-full px-5 py-4 text-lg bg-white border-2 border-slate-100 rounded-2xl focus:border-emerald-500 outline-none font-black" onkeypress="if(event.key === 'Enter') confirmAssign('${p.id}', '${p.name}', '${inputId}', '${p.mobile}')">
                    <button onclick="confirmAssign('${p.id}', '${p.name}', '${inputId}', '${p.mobile}')" class="bg-emerald-600 text-white p-4 rounded-2xl shadow-lg active:scale-90 transition-all">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </div>
            `;
        }

        function confirmAssign(id, name, inputId, mobile) {
            const val = document.getElementById(inputId).value.trim();
            if (!val) return;
            pendingAssign = { id, name, inputId, mobile, val };
            document.getElementById("confirmText").innerHTML = `Assign token <b>#${val}</b> to <b>${name}</b>?`;
            document.getElementById("confirmModal").classList.replace("hidden", "flex");
        }

        function closeConfirm() { document.getElementById("confirmModal").classList.replace("flex", "hidden"); }

        async function confirmAppointment() {
            if (!pendingAssign) return;
            closeConfirm();
            showLoading();
            try {
                await fetch("https://api.care2connect.in/api/assign", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: pendingAssign.id, name: pendingAssign.name, mobile: pendingAssign.mobile, number: pendingAssign.val })
                });
                showNotification(`Assigned: #${pendingAssign.val}`);
                loadPatients();
            } catch (err) { showNotification("Error updating", "error"); }
            finally { hideLoading(); }
        }

        function showNotification(message, type = 'success') {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = `glass-card border-${type === 'success' ? 'emerald' : 'rose'}-200 px-6 py-4 rounded-[2rem] shadow-2xl flex items-center gap-4 notification-enter pointer-events-auto`;
            notification.innerHTML = `<p class="font-extrabold text-slate-900 text-sm">${message}</p>`;
            container.appendChild(notification);
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        function showLoading() { document.getElementById("loadingOverlay").classList.replace("hidden", "flex"); }
        function hideLoading() { document.getElementById("loadingOverlay").classList.replace("flex", "hidden"); }

        window.onload = () => {
            loadPatients();
            loadStopTime();
        };
    </script>
</body>
</html>
