/* Spinner Loader Styles */
#loaderOverlay {
    display: none; /* Hidden by default */
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(4px);
    z-index: 1000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #1e40af; /* Matches your blue-800 */
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loader-text {
    margin-top: 15px;
    font-size: 10px;
    font-weight: 900;
    color: #1e40af;
    text-transform: uppercase;
    letter-spacing: 0.2em;
}

<body class="p-4 md:p-10">

    <div id="viewerOverlay" onclick="this.style.display='none'">
        <img id="fullImg" src="" class="max-w-full max-h-full rounded-lg shadow-2xl">
        <p class="absolute bottom-10 text-white font-black uppercase tracking-widest text-xs">Click anywhere to close</p>
    </div>

    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-end px-4">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter text-blue-800 uppercase leading-none">Care2Connect</h1>
                <p class="text-[10px] font-bold text-blue-500 uppercase tracking-[0.3em] mt-1">Admin Order Control</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-black text-slate-400 uppercase">Order Ref</p>
                <p id="orderIdDisplay" class="text-sm font-black text-slate-800">#RX-9920</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-card p-8 rounded-[2.5rem] shadow-xl border border-white h-full">
                <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-600"></span> Patient
                </p>
                <h2 id="patientName" class="text-2xl font-black text-slate-800 tracking-tight">Rahul Choudhary</h2>
                <p id="patientPhone" class="text-sm font-bold text-slate-500 mt-1">+91 98765 43210</p>
                <div class="mt-6 bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <p class="text-[9px] font-black text-blue-600 uppercase">Home Address</p>
                    <p id="patientAddress" class="text-[11px] font-bold text-blue-900 mt-1 leading-relaxed">Indore, Madhya Pradesh</p>
                </div>
            </div>

            <div class="md:col-span-2">
                <div class="glass-card p-3 rounded-[2.5rem] shadow-xl border border-white group relative">
                    <div class="h-64 w-full rounded-[2rem] overflow-hidden relative">
                        <img id="prescriptionImg" src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&q=80&w=1200" 
                             class="w-full h-full object-cover cursor-zoom-in"
                             onclick="openViewer(this.src)">
                        <div class="absolute inset-0 bg-blue-900/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                            <span class="bg-white text-blue-900 px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-xl">Expand Image</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[3rem] shadow-2xl border border-white space-y-6">
            <div>
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-1">Stock Exception Remarks</h3>
                <textarea id="missingMedicine" 
                    class="w-full bg-slate-50 border-2 border-slate-100 p-5 rounded-[2rem] text-sm font-semibold text-slate-700 outline-none focus:bg-white focus:border-blue-500/30 transition-all min-h-[120px] shadow-inner" 
                    placeholder="Type remarks or notes here..."></textarea>
            </div>

            <div class="flex gap-4">
                <button onclick="submitFinalFulfillment()" class="btn-submit flex-[3] py-6 rounded-[2rem] font-black uppercase text-sm tracking-[0.3em] shadow-2xl">
                    Submit Fulfillment
                </button>
                <button onclick="handleCancel()" class="btn-cancel flex-1 py-6 rounded-[2rem] font-black uppercase text-[11px] tracking-widest shadow-md">
                    Cancel Order
                </button>
            </div>
        </div>
    </div>
    <div id="loaderOverlay">
        <div class="spinner"></div>
        <p class="loader-text">Processing...</p>
    </div>

    <script>
        
        const params = new URLSearchParams(window.location.search);
        const ORDER_ID = params.get("order_id","69fb2b5bf03bbca19822d4b0");

                // Helper functions to show/hide loader
        function showLoader() {
            document.getElementById('loaderOverlay').style.display = 'flex';
        }

        function hideLoader() {
            document.getElementById('loaderOverlay').style.display = 'none';
        }

       // Update loadOrderDetails to include loader
        async function loadOrderDetails() {
            showLoader(); // Show loader when fetch starts
            try {
                const response = await fetch(`https://api.care2connect.in/c2c_app/medicine/order/${ORDER_ID}`);
                if(response.ok) {
                    const result = await response.json();
                    if(result.success && result.data) {
                        const orderData = result.data;
                        document.getElementById('patientName').innerText = orderData.patient_name || orderData.user_name || "Unknown";
                        if(orderData.user_mobile) document.getElementById('patientPhone').innerText = orderData.user_mobile;
                        if(orderData.url) document.getElementById('prescriptionImg').src = orderData.url;
                        if(orderData.order_id) document.getElementById('orderIdDisplay').innerText = '#' + orderData.order_id;
                    }
                }
            } catch (error) {
                console.error("Error fetching order details:", error);
            } finally {
                hideLoader(); // Always hide loader when done
            }
        }
                
        window.onload = loadOrderDetails;

        function openViewer(src) {
            const overlay = document.getElementById('viewerOverlay');
            document.getElementById('fullImg').src = src;
            overlay.style.display = 'flex';
        }

            // Update updateOrder to include loader
        async function updateOrder(payload) {
            showLoader(); // Show loader when submission starts
            const apiUrl = `https://api.care2connect.in/c2c_app/medicine/update/${ORDER_ID}`;
            payload.updated_at = new Date().toISOString();

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(`Action Successful: ${payload.status ? payload.status.toUpperCase() : 'Updated'}`);
                } else {
                    alert("Error communicating with server.");
                }
            } catch (error) {
                alert("Connection failed.");
            } finally {
                hideLoader(); // Always hide loader when done
            }
}
        function submitFinalFulfillment() {
            const remarksText = document.getElementById('missingMedicine').value;
            // Now using 'remark' as the exact key required by the backend
            updateOrder({ 
                status: 'confirmed', 
                remark: remarksText 
            });
        }

        function handleCancel() {
            if(confirm("Confirm Cancellation?")) {
                updateOrder({ status: 'cancelled' });
            }
        }
    </script>
</body>
</html>
