<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Refunds Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F8FAFC] min-h-screen text-slate-800 antialiased pb-32">

    <div 
        class="w-full max-w-md mx-auto px-4 pt-6"
        x-data="{
            appointments: [],
            selectedAppointments: new Set(),
            selectedDate: new Date().toISOString().split('T')[0],
            selectedTimeSlot: 'All',
            activeFilter: 'non-refunded',
            isLoading: false,
            showConfirmModal: false,
            toast: { show: false, message: '', type: 'success' },
            
            // Injected directly from your Flask render_template context variable
            doctorId: '{{ doctor_id }}',

            getCookie(name) {
                let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                if (match) return decodeURIComponent(match[2]);
                return null;
            },

            get filteredAppointments() {
                return this.appointments.filter(function(app) {
                    const hasRefundId = app.hasOwnProperty('refund_id') && app.refund_id !== null && app.refund_id !== '';
                    const matchesRefundFilter = this.activeFilter === 'refunded' ? hasRefundId : !hasRefundId;
                    const matchesTimeFilter = this.selectedTimeSlot === 'All' || app.time_slot === this.selectedTimeSlot;
                    return matchesRefundFilter && matchesTimeFilter;
                }.bind(this));
            },

            get counters() {
                let refunded = this.appointments.filter(function(a) { 
                    return a.hasOwnProperty('refund_id') && a.refund_id !== null && a.refund_id !== ''; 
                }).length;
                return {
                    refunded: refunded,
                    nonRefunded: this.appointments.length - refunded
                };
            },

            get uniqueTimeSlots() {
                let slots = this.appointments.map(function(app) { return app.time_slot; }).filter(Boolean);
                return ['All', ...new Set(slots)];
            },

            get isAllSelected() {
                if(this.filteredAppointments.length === 0) return false;
                return this.filteredAppointments.every(function(app) { 
                    return this.selectedAppointments.has(app.appoint_number); 
                }.bind(this));
            },

            triggerToast(msg, type) {
                this.toast.message = msg;
                this.toast.type = type || 'success';
                this.toast.show = true;
                setTimeout(function() { this.toast.show = false; }.bind(this), 3500);
            },

            async fetchAppointments() {
                this.isLoading = true;
                this.selectedAppointments.clear();
                this.selectedTimeSlot = 'All';
                
                // Using the injected route parameter tokens for your endpoints
                const apiUrl = 'https://api.care2connect.in/get_appointments/' + this.selectedDate + '/' + this.doctorId;
                
                try {
                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error();
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        this.appointments = data.filter(function(item) { return parseFloat(item.amount) > 0; });
                    } else {
                        this.appointments = [];
                    }
                } catch (error) {
                    this.triggerToast('Failed to fetch Appointments.', 'error');
                    this.appointments = [];
                } finally {
                    this.isLoading = false;
                    this.$nextTick(function() { lucide.createIcons(); });
                }
            },

            toggleSelectAll() {
                if (this.isAllSelected) {
                    this.filteredAppointments.forEach(function(app) { this.selectedAppointments.delete(app.appoint_number); }.bind(this));
                } else {
                    this.filteredAppointments.forEach(function(app) { this.selectedAppointments.add(app.appoint_number); }.bind(this));
                }
            },

            toggleSelectRow(id) {
                if (this.selectedAppointments.has(id)) {
                    this.selectedAppointments.delete(id);
                } else {
                    this.selectedAppointments.add(id);
                }
            },


            async confirmBulkAction() {
                this.showConfirmModal = false;
                
                const selectedArray = this.appointments.filter(function(app) { 
                    return this.selectedAppointments.has(app.appoint_number); 
                }.bind(this));

                if (selectedArray.length === 0) return;

                const doctorName = this.getCookie('name') || 'Dr. Unknown';

                const selectedDataArray = selectedArray.map(function(app) {
                    return {
                        'pay_id': app.pay_id,
                        'amount': app.amount,
                        'doctor_phone_id': app.doctor_phone_id,
                        'phone': app.whatsapp_number,
                        'name': app.patient_name,
                        'appointmentdate': app.date_of_appointment,
                        'timeslot': app.time_slot,
                        'doctor_name': doctorName
                    };
                });

                this.isLoading = true;


                try {
                    const response = await fetch('https://api.care2connect.in/function_refund/refund-payments-request/{{ doctor_id }}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(selectedDataArray)
                    });

                    if (!response.ok) throw new Error();
                    const result = await response.json();

                    this.appointments = this.appointments.map(function(app) {
                        if (this.selectedAppointments.has(app.appoint_number)) {
                            return Object.assign({}, app, { refund_id: result.refund_id || 'REF_DONE' });
                        }
                        return app;
                    }.bind(this));

                    this.triggerToast('Successfully processed execution pipeline.', 'success');
                    this.selectedAppointments.clear();

                } catch (error) {
                    this.triggerToast('Database sync failure encountered.', 'error');
                } finally {
                    this.isLoading = false;
                    this.$nextTick(function() { lucide.createIcons(); });
                }
            }
        }"
        x-init="fetchAppointments(); $watch('selectedDate', function() { fetchAppointments(); })"
    >
        
        <header class="flex items-center justify-between mb-6">
            <div>
                <span class="text-xs font-bold tracking-widest text-slate-400 uppercase">Management Portal</span>
                <h1 class="text-2xl font-black tracking-tight text-slate-900 mt-0.5">Refunds Center</h1>
            </div>
            <div class="h-10 w-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center border border-emerald-100/60 shadow-xs">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
            </div>
        </header>

        <nav class="bg-slate-200/60 backdrop-blur-md p-1 rounded-2xl flex w-full gap-1 mb-5 border border-slate-300/30">
            <button 
                x-on:click="activeFilter = 'non-refunded'; selectedAppointments.clear();"
                :class="activeFilter === 'non-refunded' ? 'bg-white text-slate-900 shadow-sm font-bold scale-[1.01]' : 'text-slate-500 font-medium hover:text-slate-800'"
                class="flex-1 text-center py-3 text-xs rounded-xl transition-all duration-300"
            >
                Active (<span x-text="counters.nonRefunded">0</span>)
            </button>
            <button 
                x-on:click="activeFilter = 'refunded'; selectedAppointments.clear();"
                :class="activeFilter === 'refunded' ? 'bg-slate-900 text-white shadow-md font-bold scale-[1.01]' : 'text-slate-500 font-medium hover:text-slate-800'"
                class="flex-1 text-center py-3 text-xs rounded-xl transition-all duration-300"
            >
                Archived (<span x-text="counters.refunded">0</span>)
            </button>
        </nav>

        <section class="bg-white p-5 rounded-3xl shadow-xs border border-slate-200/60 flex flex-col gap-4 mb-6">
            <div class="grid grid-cols-2 gap-3 w-full">
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 flex items-center gap-1">
                        <i data-lucide="calendar" class="w-3 h-3"></i> Date
                    </label>
                    <input 
                        type="date" 
                        x-model="selectedDate" 
                        class="w-full bg-slate-50 border border-slate-200/80 text-xs font-semibold text-slate-700 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all cursor-pointer"
                    >
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 flex items-center gap-1">
                        <i data-lucide="clock" class="w-3 h-3"></i> Slot Window
                    </label>
                    <select 
                        x-model="selectedTimeSlot"
                        :disabled="appointments.length === 0"
                        class="w-full bg-slate-50 border border-slate-200/80 text-xs font-semibold text-slate-700 rounded-xl p-3 appearance-none focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all disabled:opacity-40 cursor-pointer"
                    >
                        <template x-for="slot in uniqueTimeSlots" :key="slot">
                            <option :value="slot" x-text="slot"></option>
                        </template>
                    </select>
                </div>
            </div>
        </section>

        <div 
            x-show="activeFilter !== 'refunded' &amp;&amp; filteredAppointments.length > 0 &amp;&amp; !isLoading"
            class="bg-white/60 rounded-2xl p-3 px-4 flex items-center justify-between border border-slate-200/40 shadow-xs mb-4"
        >
            <div class="flex items-center gap-2">
                <i data-lucide="check-square" class="w-4 h-4 text-slate-400"></i>
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Select All Cards</span>
            </div>
            <input 
                type="checkbox" 
                :checked="isAllSelected"
                x-on:change="toggleSelectAll()"
                class="w-5 h-5 rounded-md text-emerald-600 border-slate-300 accent-emerald-500 scale-105 transition-all cursor-pointer"
            >
        </div>

        <main class="space-y-3.5">
            
            <template x-if="isLoading">
                <div class="space-y-3">
                    <template x-for="i in [1, 2, 3]">
                        <div class="p-5 bg-white border border-slate-200/60 rounded-3xl space-y-3 animate-pulse shadow-xs">
                            <div class="flex justify-between items-center">
                                <div class="h-3 w-16 bg-slate-200 rounded-sm"></div>
                                <div class="h-5 w-20 bg-slate-200 rounded-lg"></div>
                            </div>
                            <div class="h-4 w-3/4 bg-slate-200 rounded-md"></div>
                            <div class="flex gap-4 pt-2 border-t border-slate-100">
                                <div class="h-3 w-24 bg-slate-200 rounded-sm"></div>
                                <div class="h-3 w-16 bg-slate-200 rounded-sm"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <div 
                x-show="!isLoading &amp;&amp; filteredAppointments.length === 0" 
                class="bg-white rounded-3xl p-10 border border-slate-200/50 text-center flex flex-col items-center justify-center gap-4 shadow-xs"
            >
                <div class="w-14 h-14 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-300 border border-slate-100 shadow-inner">
                    <i data-lucide="inbox" class="w-6 h-6"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-slate-800">Clear Workspace</h3>
                    <p class="text-xs font-medium text-slate-400 mt-0.5">No records fit your criteria parameters.</p>
                </div>
            </div>

            <div x-show="!isLoading">
                <template x-for="appointment in filteredAppointments" :key="appointment.appoint_number">
                    <div 
                        x-on:click="activeFilter !== 'refunded' ? toggleSelectRow(appointment.appoint_number) : null"
                        :class="selectedAppointments.has(appointment.appoint_number) ? 'border-emerald-500 bg-emerald-50/20 ring-1 ring-emerald-500/50 shadow-sm' : 'border-slate-200/70 bg-white hover:border-slate-300'"
                        class="p-5 rounded-3xl border shadow-xs transition-all duration-300 flex items-start gap-4 relative cursor-pointer active:scale-[0.98] mb-3.5"
                    >
                        <div x-show="activeFilter !== 'refunded'" class="pt-1.5" x-on:click.stop>
                            <input 
                                type="checkbox" 
                                :checked="selectedAppointments.has(appointment.appoint_number)"
                                x-on:change="toggleSelectRow(appointment.appoint_number)"
                                class="w-5 h-5 rounded-md text-emerald-600 border-slate-300 accent-emerald-500 scale-105 cursor-pointer"
                            >
                        </div>

                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2 mb-1.5">
                                <span class="text-[10px] font-black text-slate-400 tracking-widest uppercase" x-text="'Slot #' + appointment.appoint_number"></span>
                                
                                <div class="flex gap-1">
                                    <span x-show="appointment.refund_id" class="text-[9px] font-extrabold px-2.5 py-1 bg-rose-50 text-rose-600 border border-rose-100 rounded-lg tracking-wider">REFUNDED</span>
                                    <span x-show="!appointment.refund_id &amp;&amp; appointment.pay_id?.startsWith('old')" class="text-[9px] font-extrabold px-2.5 py-1 bg-amber-50 text-amber-600 border border-amber-100 rounded-lg tracking-wider">REAPPOINTMENT</span>
                                    <span x-show="!appointment.refund_id &amp;&amp; !appointment.pay_id?.startsWith('old')" class="text-[9px] font-extrabold px-2.5 py-1 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg tracking-wider">NEW</span>
                                </div>
                            </div>

                            <h3 class="text-base font-extrabold text-slate-800 tracking-tight uppercase truncate" x-text="appointment.patient_name"></h3>

                            <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-3 pt-3 border-t border-slate-100 text-xs font-semibold text-slate-500">
                                <span class="flex items-center gap-1.5">
                                    <i data-lucide="smartphone" class="w-3.5 h-3.5 text-slate-400"></i>
                                    <span x-text="appointment.whatsapp_number" class="text-slate-600 font-medium"></span>
                                </span>
                                <span class="flex items-center gap-1.5">
                                    <i data-lucide="timer" class="w-3.5 h-3.5 text-slate-400"></i>
                                    <span x-text="appointment.time_slot" class="text-slate-600 font-medium"></span>
                                </span>
                                <span x-show="appointment.kalra_id" class="flex items-center gap-1.5 text-emerald-600">
                                    <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                                    <span x-text="'ID: ' + appointment.kalra_id" class="font-bold"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </main>

        <footer class="fixed bottom-4 left-4 right-4 max-w-sm mx-auto bg-slate-900/95 border border-slate-800 shadow-2xl rounded-3xl backdrop-blur-lg p-4 z-40">
            <div class="flex items-center justify-between gap-4">
                <div class="flex flex-col pl-1">
                    <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Active Queue</span>
                    <p class="text-xs font-bold text-white mt-0.5" x-text="activeFilter !== 'refunded' ? selectedAppointments.size + ' patients marked' : 'Browsing Archives'"></p>
                </div>

                <div>
                    <button 
                        x-on:click="showConfirmModal = true"
                        x-show="selectedAppointments.size > 0 &amp;&amp; activeFilter !== 'refunded' &amp;&amp; !isLoading"
                        class="bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-600 hover:to-rose-700 text-white font-bold text-xs px-5 py-3 rounded-2xl shadow-lg shadow-rose-500/20 active:scale-95 transition-all flex items-center justify-center gap-2 tracking-wide cursor-pointer"
                    >
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        <span x-text="'Issue Refund Request (' + selectedAppointments.size + ')'"></span>
                    </button>
                    
                    <div 
                        x-show="selectedAppointments.size === 0 || activeFilter === 'refunded' || isLoading"
                        class="text-[10px] font-black text-slate-500 tracking-widest uppercase border border-slate-800 bg-slate-800/40 rounded-xl px-3 py-2"
                    >
                        Standby
                    </div>
                </div>
            </div>
        </footer>

        <div 
            x-show="showConfirmModal" 
            class="fixed inset-0 z-50 flex items-end justify-center bg-black/60 backdrop-blur-xs transition-opacity duration-300"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            style="display: none;"
        >
            <div 
                x-on:click.outside="showConfirmModal = false"
                class="w-full max-w-sm bg-white rounded-t-3xl p-6 shadow-2xl border-t border-slate-100"
                x-transition:enter="transition ease-out duration-300 transform"
                x-transition:enter-start="translate-y-full"
                x-transition:enter-end="translate-y-0"
                x-transition:leave="transition ease-in duration-200 transform"
                x-transition:leave-start="translate-y-0"
                x-transition:leave-end="translate-y-full"
            >
                <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
                <div class="flex items-center gap-3 text-rose-600 mb-2">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                    <h3 class="text-base font-black tracking-tight">Confirm Mass Refund</h3>
                </div>
                <p class="text-xs font-semibold text-slate-500 leading-relaxed mb-6">
                    You are initiating transaction reversals for <span class="text-slate-800 font-bold" x-text="selectedAppointments.size"></span> marked medical files. This cannot be undone automatically. Proceed?
                </p>
                <div class="grid grid-cols-2 gap-3">
                    <button 
                        x-on:click="showConfirmModal = false"
                        class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold py-3.5 rounded-xl transition-all cursor-pointer"
                    >
                        Cancel
                    </button>
                    <button 
                        x-on:click="confirmBulkAction()"
                        class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-3.5 rounded-xl transition-all shadow-md shadow-rose-600/10 cursor-pointer"
                    >
                        Authorize
                    </button>
                </div>
            </div>
        </div>

        <div 
            x-show="toast.show"
            x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="translate-y-[-20px] opacity-0"
            x-transition:enter-end="translate-y-0 opacity-100"
            x-transition:leave="transition ease-in duration-200 transform"
            x-transition:leave-start="translate-y-0 opacity-100"
            x-transition:leave-end="translate-y-[-20px] opacity-0"
            :class="toast.type === 'success' ? 'bg-slate-900 border-emerald-500 text-white' : 'bg-rose-900 border-rose-500 text-white'"
            class="fixed top-4 left-4 right-4 max-w-sm mx-auto p-4 rounded-2xl shadow-xl flex items-center gap-3 border z-50 backdrop-blur-md"
            style="display: none;"
        >
            <div :class="toast.type === 'success' ? 'text-emerald-400' : 'text-rose-400'">
                <i :data-lucide="toast.type === 'success' ? 'check-circle' : 'info'" class="w-5 h-5"></i>
            </div>
            <p class="text-xs font-bold tracking-tight flex-1" x-text="toast.message"></p>
            <button x-on:click="toast.show = false" class="text-slate-400 hover:text-white transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
